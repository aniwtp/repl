[package]
name = "repl"
version = "0.1.0"
edition = "2024"
description = "Read-only replication over capnp/TCP/TLS1.3 (self-signed, SPKI pinning) for redb-backed services."

[features]
default = []

[dependencies]
db-wrapper = { path = "../../../db-wrapper" }
shodh-redb = { git = "https://github.com/umzi2/shodh-redb-fork", branch = "perf/upstream-port", features = ["compression_lz4"] }
ntex = { version = "4", features = ["compio"] }
compio-io = { version = "0.10", features = ["compat"] }
compio-net = "0.12"
compio-tls = { version = "0.10", default-features = false, features = ["rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
capnp = "0.26"
capnp-futures = "0.26"
futures = "0.3"
sha2 = "0.10"
socket2 = { version = "0.6", features = ["all"] }
parking_lot = "0.12"
log = "0.4"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
getrandom = "0.3"

[build-dependencies]
capnpc = "0.26"

[dev-dependencies]
tempfile = "3"
